# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]


# ---------------- Team tool ----------------
  - name: dedupe
    description: "Loại các item TRÙNG LẶP khỏi danh sách kết quả ĐÃ CÓ (cùng URL hoặc cùng tiêu đề), giữ lại item xuất hiện đầu tiên. DÙNG KHI: đã gộp kết quả từ nhiều tool (ví dụ lookup + social_search) hoặc người dùng muốn bỏ tin trùng, TRƯỚC khi format thành bản tin. KHÔNG DÙNG để tìm kiếm hay lấy dữ liệu mới, và không cần khi chỉ có một nguồn với vài kết quả."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item đã thu thập; mỗi item có title, url, source, summary."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
      required: [items]

  - name: current_time
    description: "Cho biết ngày, giờ và thứ HIỆN TẠI theo một múi giờ. DÙNG KHI: người dùng hỏi bây giờ là mấy giờ, hôm nay là ngày/thứ mấy, hoặc cần ghi ngày hôm nay vào bản tin. KHÔNG DÙNG để tìm tin tức (dùng lookup) hay khi người dùng đã nêu rõ ngày."
    parameters:
      type: object
      properties:
        timezone: {type: string, default: "Asia/Ho_Chi_Minh", description: "Múi giờ IANA (ví dụ 'Asia/Ho_Chi_Minh', 'America/New_York') hoặc 'UTC+7'. Mặc định giờ Việt Nam."}
      required: []

  - name: extract_links
    description: "Rút các đường link (URL) ra từ MỘT ĐOẠN VĂN BẢN người dùng dán vào (email, ghi chú, đoạn chat), bỏ link trùng. DÙNG KHI: người dùng muốn liệt kê/gom các link có trong đoạn văn. KHÔNG DÙNG khi người dùng chỉ đưa một link và muốn đọc nội dung (dùng fetch)."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nguyên văn đoạn văn bản chứa các link; chép đúng như người dùng đã dán."}
      required: [text]

  - name: cite_source
    description: "Tạo MỘT dòng trích dẫn nguồn (markdown, APA đơn giản hoặc plain) từ thông tin người dùng đã cho. DÙNG KHI: người dùng muốn ghi nguồn/trích dẫn cho một bài đã biết link. KHÔNG DÙNG để tìm hay đọc bài (dùng lookup hoặc fetch) và không kiểm chứng thông tin; thiếu link thì hỏi lại bằng clarify."
    parameters:
      type: object
      properties:
        title: {type: string, default: "", description: "Tiêu đề bài viết."}
        url: {type: string, default: "", description: "Link đầy đủ (http/https) của nguồn."}
        author: {type: string, default: "", description: "Tác giả hoặc tổ chức (tùy chọn)."}
        date: {type: string, default: "", description: "Ngày đăng, ví dụ '2026-01-05' (tùy chọn)."}
        style: {type: string, enum: [markdown, apa, plain], default: "markdown", description: "Kiểu trích dẫn: 'apa' khi người dùng yêu cầu APA, 'markdown' mặc định."}
      required: [url]